<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico | Sistema Bancário Simplificado</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <div class="sidebar-logo">
                <i data-lucide="landmark"></i>
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    <i data-lucide="wallet-cards"></i>
                    <span>Contas</span>
                </a>

                <a href="new-transaction.html" class="menu-item">
                    <i data-lucide="arrow-right-left"></i>
                    <span>Nova Transação</span>
                </a>

                <a href="history.html" class="menu-item active">
                    <i data-lucide="clipboard-list"></i>
                    <span>Histórico</span>
                </a>

            </nav>

        </div>

        <a href="index.html" class="logout">
            <i data-lucide="log-out"></i>
            <span>Sair</span>
        </a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div></div>

            <div class="user-menu">

                <div
                        class="user-avatar"
                        id="user-avatar"
                >
                    --
                </div>

                <span id="user-name">
    Usuário


                <i data-lucide="chevron-down"></i>

            </div>

        </header>


        <!-- PAGE HEADER --><!-- PAGE HEADER -->
        <section class="page-header history-header">

            <div>
                <h1>Histórico de Transações</h1>
                <p>Confira suas transações realizadas</p>
            </div>

        </section>


        <!-- FILTERS -->
        <section class="history-filters">

            <div class="filter-field">

                <label for="filter-account">
                    Conta
                </label>

                <select id="filter-account">

                    <option value="" disabled selected>
                        Selecione uma conta
                    </option>

                </select>
            </div>


            <div class="filter-field">

                <label for="filter-type">
                    Tipo
                </label>

                <select id="filter-type">

                    <option value="">
                        Todos
                    </option>

                    <option value="DEPOSIT">
                        Depósito
                    </option>

                    <option value="WITHDRAW">
                        Saque
                    </option>

                    <option value="TRANSFER">
                        Transferência
                    </option>

                </select>

            </div>


            <div class="filter-field">

                <label for="start-date">
                    Data inicial
                </label>

                <input
                        type="date"
                        id="start-date"
                >

            </div>


            <div class="filter-field">

                <label for="end-date">
                    Data final
                </label>

                <input
                        type="date"
                        id="end-date"
                >

            </div>


            <button
                    type="button"
                    class="filter-button"
                    id="filter-button"
            >
                <i data-lucide="search"></i>
                Filtrar
            </button>
        </section>


        <!-- TRANSACTIONS TABLE -->
        <section class="history-container">

            <div class="table-wrapper">

                <table class="transactions-table">

                    <thead>

                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Conta</th>
                        <th>Valor</th>
                        <th>Status</th>
                    </tr>

                    </thead>

                    <tbody id="transactions-body">

                    </tbody>

                </table>

                <div
                        class="pagination"
                        id="pagination"
                >
                </div>

            </div>

        </section>

    </main>

</div>
<script src="js/config.js?v=1.0.1"></script>
<script>
    lucide.createIcons();
</script>

<script src="js/auth-guard.js?v=1.0.1"></script>
<script src="js/history.js?v=1.0.1"></script>
<script src="js/user-header.js?v=1.0.1"></script>
</body>

</html>
