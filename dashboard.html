<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contas | Sistema Bancário Simplificado</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app-container">
    <aside class="sidebar">

        <div>

            <div class="sidebar-logo">
                <i data-lucide="landmark"></i>
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item active">
                    <i data-lucide="wallet-cards"></i>
                    <span>Contas</span>
                </a>

                <a href="new-transaction.html" class="menu-item">
                    <i data-lucide="arrow-right-left"></i>
                    <span>Nova Transação</span>
                </a>

                <a href="history.html" class="menu-item">
                    <i data-lucide="clipboard-list"></i>
                    <span>Histórico</span>
                </a>

            </nav>

        </div>

        <a href="index.html" class="logout">
            <i data-lucide="log-out"></i>
            <span>Sair</span>
        </a>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div></div>

            <div class="user-menu">

                <div
                        class="user-avatar"
                        id="user-avatar"
                >
                    --
                </div>

                <span id="user-name">
    Usuário
</span>


                <i data-lucide="chevron-down"></i>

            </div>

        </header>


        <section class="page-header">

            <div>
                <h1>Contas</h1>
                <p>Suas contas vinculadas</p>
            </div>

            <button
                    type="button"
                    class="new-account-button"
                    id="new-account-button"
            >
                <i data-lucide="plus"></i>
                Nova Conta
            </button>

        </section>


        <section class="accounts-grid" id="accounts-grid">

            <p id="accounts-loading">Carregando contas...</p>

            <article
                    class="add-account-card"
                    id="add-account-card"
            >

                <div class="add-icon">
                    <i data-lucide="plus"></i>
                </div>

                <span>
            Adicionar conta
        </span>

            </article>

        </section>

    </main>

</div>


<div class="modal-overlay" id="account-modal">

    <div class="transaction-modal account-modal">

        <button
                type="button"
                class="modal-close"
                id="account-modal-close"
        >
            <i data-lucide="x"></i>
        </button>


        <div class="modal-header">

            <div class="modal-icon account-modal-icon">
                <i data-lucide="wallet-cards"></i>
            </div>

            <div>

                <h2>
                    Nova Conta
                </h2>

                <p>
                    Crie uma nova conta vinculada ao seu cadastro
                </p>

            </div>

        </div>

        <div class="account-info">

            <i data-lucide="info"></i>

            <p>
                O número da sua conta será gerado automaticamente ao concluir a criação.
            </p>

        </div>


        <div class="modal-actions">

            <button
                    type="button"
                    class="cancel-button"
                    id="account-cancel-button"
            >
                Cancelar
            </button>

            <button
                    type="button"
                    class="confirm-button"
                    id="create-account-button"
            >
                Criar conta
            </button>

        </div>

    </div>

</div>

<script src="js/config.js?v=1.0.1"></script>
<script src="js/account.js?v=1.0.1"></script>

<script>
    lucide.createIcons();
</script>
<script src="js/auth-guard.js?v=1.0.1"></script>
<script src="js/dashboard.js?v=1.0.2"></script>
<script src="js/user-header.js?v=1.0.1"></script>

<script>
    lucide.createIcons();
</script>
</body>

</html>
