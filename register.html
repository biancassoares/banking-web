<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Sistema Bancário Simplificado</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="login-container">

    <!-- LADO ESQUERDO -->
    <section class="login-brand">

        <div class="brand-content">

            <div class="brand-icon">
                🏦
            </div>

            <h1>Sistema Bancário</h1>

            <p>
                Gerencie sua conta de forma simples e segura.
            </p>

        </div>

    </section>


    <!-- LADO DIREITO -->
    <section class="login-form-section">

        <div class="login-form-container">

            <!-- HEADER -->
            <div class="login-header">

                <h2>Crie sua conta</h2>

                <p>
                    Preencha seus dados para começar.
                </p>

            </div>


            <!-- AVISO -->
            <div class="test-info">

                <span class="test-info-icon">
                    i
                </span>

                <p>
                    <strong> Não utilize dados pessoais reais. </strong>
                    Para testar, você pode usar
                    <i>seunome@teste.com</i>
                    e um CPF fictício com 11 números.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form id="register-form">

                <div class="form-group">

                    <label for="name">
                        Nome completo
                    </label>

                    <input
                            type="text"
                            id="name"
                            placeholder="Digite seu nome"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="seunome@teste.com"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                            type="text"
                            id="cpf"
                            placeholder="00000000000"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                            type="password"
                            id="password"
                            placeholder="Crie uma senha"
                            required
                    >

                </div>


                <button type="submit" class="login-button">
                    Criar conta
                </button>

            </form>
            <p id="register-message"></p>


            <p class="register-text">
                Já tem uma conta?
                <a href="index.html">Entrar</a>
            </p>

        </div>

    </section>

</main>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>

</html>
